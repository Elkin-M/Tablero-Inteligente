<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tablero Ambiental - EcoLibertad</title>

  <!-- Google Fonts: Poppins (Titulares) e Inter (Cuerpo) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Poppins:wght@600;700&display=swap" rel="stylesheet">

  <!-- Lucide Icons Vectoriales -->
  <script src="https://unpkg.com/lucide@latest"></script>

  <style>
    /* VARIABLES ECO-INSTITUCIONALES */
    :root {
      --color-primary: #2E7D32;       /* Verde Bosque */
      --color-primary-dark: #1B4332;  /* Verde Oscuro Profundo */
      --color-accent: #4CAF50;        /* Verde Hoja */
      --color-surface-light: #E8F5E9; /* Verde Menta Claro */
      --color-text-main: #1B4332;     /* Texto Principal */
      --color-text-muted: #52796F;    /* Texto Secundario */
      --color-bg-page: #F4F9F5;       /* Fondo General */
      --color-card-bg: #FFFFFF;       /* Blanco Puro */
      --color-border: #D8EAD9;        /* Borde Suave */
      --color-live: #4CAF50;          /* Indicador En Vivo */

      --shadow-sm: 0 4px 12px rgba(27, 67, 50, 0.05);
      --shadow-md: 0 8px 24px rgba(27, 67, 50, 0.08);

      --font-heading: 'Poppins', sans-serif;
      --font-body: 'Inter', sans-serif;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      height: 100%;
      overflow: hidden;
    }

    body {
      font-family: var(--font-body);
      background-color: var(--color-bg-page);
      color: var(--color-text-main);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    h2, h3 {
      font-family: var(--font-heading);
      color: var(--color-primary-dark);
      font-weight: 700;
    }

    /* BARRA DE NAVEGACIÓN */
    header {
      background: linear-gradient(135deg, var(--color-primary) 0%, var(--color-primary-dark) 100%);
      color: #FFFFFF;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0.75rem 1.75rem;
      height: 64px;
      flex-shrink: 0;
      box-shadow: var(--shadow-md);
      position: relative;
      z-index: 10;
    }

    header .brand {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      font-family: var(--font-heading);
      font-size: 1.25rem;
      font-weight: 700;
    }

    header .brand img.logo {
      height: 40px;
      width: auto;
    }

    header .status {
      display: flex;
      align-items: center;
      gap: 0.85rem;
    }

    #connStatus {
      padding: 0.35rem 0.85rem;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.15);
      font-size: 0.75rem;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    #connStatus.live .live-dot {
      background: var(--color-live);
      box-shadow: 0 0 8px var(--color-live);
    }

    .live-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.5);
    }

    #clock {
      font-weight: 600;
      background: rgba(255, 255, 255, 0.15);
      padding: 0.35rem 0.75rem;
      border-radius: 999px;
    }

    /* ESTRUCTURA PRINCIPAL */
    main {
      flex: 1;
      display: grid;
      grid-template-columns: 300px 1fr;
      gap: 1.25rem;
      padding: 1.25rem;
      min-height: 0;
    }

    .sidebar {
      display: flex;
      flex-direction: column;
      min-height: 0;
    }

    .content-col {
      display: flex;
      flex-direction: column;
      gap: 1.25rem;
      min-height: 0;
    }

    .card {
      background: var(--color-card-bg);
      border-radius: 24px;
      padding: 1.5rem;
      box-shadow: var(--shadow-sm);
      border: 1px solid var(--color-border);
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .card h3 {
      font-size: 1.1rem;
      margin-bottom: 1rem;
      display: flex;
      align-items: center;
      gap: 0.6rem;
      color: var(--color-primary-dark);
    }

    .card h3 i {
      color: var(--color-primary);
      width: 20px;
      height: 20px;
    }

    /* RANKING */
    .ranking-container {
      flex: 1;
      overflow-y: auto;
      padding-right: 0.5rem;
    }

    .ranking-container::-webkit-scrollbar { width: 4px; }
    .ranking-container::-webkit-scrollbar-thumb { background: var(--color-border); border-radius: 10px; }

    .ranking-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0.85rem 1.15rem;
      border-radius: 16px;
      margin-bottom: 0.6rem;
      font-size: 0.95rem;
      font-weight: 600;
      background: var(--color-surface-light);
      transition: all 0.3s ease;
    }

    .ranking-item.active {
      background: var(--color-primary);
      color: #FFFFFF;
      transform: translateX(5px);
    }

    /* FILA SUPERIOR: CARRUSEL Y EVENTOS */
    .top-row {
      flex: 1.6; /* Ocupa más espacio */
      display: grid;
      grid-template-columns: 1fr 340px;
      gap: 1.25rem;
      min-height: 0;
    }

    .carousel-section {
      background: var(--color-card-bg);
      border-radius: 24px;
      padding: 1.5rem;
      display: flex;
      flex-direction: column;
      gap: 1.25rem;
      box-shadow: var(--shadow-sm);
      border: 1px solid var(--color-border);
    }

    .carousel-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    #roomName {
      font-size: 1.75rem;
      color: var(--color-primary);
    }

    .timer-bar {
      width: 200px;
      height: 8px;
      background: var(--color-surface-light);
      border-radius: 999px;
      overflow: hidden;
    }

    .timer-fill {
      height: 100%;
      background: var(--color-primary);
      width: 0%;
      transition: width 0.2s linear;
    }

    .carousel-grid {
      display: grid;
      grid-template-columns: 1.5fr 1fr;
      gap: 1.5rem;
      flex: 1;
      min-height: 0;
      align-items: center;
    }

    .photo-box {
      border-radius: 24px;
      overflow: hidden;
      background: var(--color-surface-light);
      aspect-ratio: 16 / 9; /* Mantiene la forma sin importar la imagen */
      width: 100%;
      position: relative;
      box-shadow: inset 0 0 20px rgba(0,0,0,0.05);
    }

    .photo-box img {
      width: 100%;
      height: 100%;
      object-fit: cover; /* Recorta la imagen para llenar el contenedor */
      display: block;
      transition: transform 0.5s ease;
    }

    .room-info {
      display: flex;
      flex-direction: column;
      justify-content: center;
      gap: 1rem;
    }

    .info-pill {
      background: var(--color-surface-light);
      padding: 1.15rem;
      border-radius: 18px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 1.05rem;
    }

    .info-pill b {
      color: var(--color-primary-dark);
      font-size: 1.3rem;
    }

    /* EVENTOS */
    .event-item {
      padding: 1rem;
      border-radius: 16px;
      background: var(--color-surface-light);
      margin-bottom: 0.75rem;
    }

    .event-item b {
      color: var(--color-primary);
      display: block;
      font-size: 1rem;
      margin-bottom: 0.25rem;
    }

    .event-item span {
      font-size: 0.9rem;
      color: var(--color-text-main);
      font-weight: 500;
    }

    /* FILA INFERIOR */
    .bottom-row {
      flex: 0.6;
      display: grid;
      grid-template-columns: 1fr 1.2fr;
      gap: 1.25rem;
      min-height: 0;
    }

    .tip-text {
      font-size: 1.1rem;
      line-height: 1.6;
      color: var(--color-text-muted);
      font-weight: 500;
    }

    .stat-mini-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
      gap: 1rem;
    }

    .stat-mini {
      background: var(--color-surface-light);
      padding: 1rem;
      border-radius: 18px;
      text-align: center;
    }

    .stat-mini span {
      display: block;
      font-size: 1.75rem;
      font-weight: 800;
      color: var(--color-primary);
      margin-bottom: 0.25rem;
    }

    .stat-mini b {
      font-size: 0.8rem;
      text-transform: uppercase;
      color: var(--color-text-muted);
    }

    /* RESPONSIVIDAD BÁSICA */
    @media (max-width: 1100px) {
      main { grid-template-columns: 1fr; overflow-y: auto; }
      .sidebar { display: none; }
      .top-row { grid-template-columns: 1fr; height: auto; }
      .bottom-row { grid-template-columns: 1fr; height: auto; }
      .carousel-grid { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>

<header>
  <div class="brand">
    <img src="logo.png" alt="Logo" class="logo">
    <span class="brand-text">Tablero Ambiental EcoLibertad</span>
  </div>
  <div class="status">
    <div id="connStatus">
      <div class="live-dot"></div>
      <span id="connLabel">Conectando...</span>
    </div>
    <span id="clock">--:--</span>
  </div>
</header>

<main>
  <!-- SIDEBAR: RANKING -->
  <aside class="sidebar">
    <div class="card" style="height: 100%;">
      <h3><i data-lucide="trophy"></i> Ranking Salones</h3>
      <div class="ranking-container" id="rankingList">
        <p>Cargando ranking...</p>
      </div>
    </div>
  </aside>

  <div class="content-col">
    <!-- FILA SUPERIOR: CARRUSEL Y CALENDARIO -->
    <div class="top-row">
      <section class="carousel-section">
        <div class="carousel-top">
          <h2 id="roomName">Cargando...</h2>
          <div class="timer-bar"><div class="timer-fill" id="timerFill"></div></div>
        </div>
        <div class="carousel-grid">
          <div class="photo-box">
            <img id="roomImg" src="https://images.unsplash.com/photo-1509062522246-3755977927d7?w=800" alt="Aula" />
          </div>
          <div class="room-info">
            <div class="info-pill"><span>Puntaje</span><b id="rPts">0</b></div>
            <div class="info-pill"><span>Revisiones</span><b id="rEvs">0</b></div>
            <div class="info-pill"><span>Última</span><b id="rDate">-</b></div>
          </div>
        </div>
      </section>

      <div class="card">
        <h3><i data-lucide="calendar"></i> Calendario Ambiental</h3>
        <div id="eventList" class="ranking-container">
          <p>Cargando eventos...</p>
        </div>
      </div>
    </div>

    <!-- FILA INFERIOR: TIP Y CONTADORES -->
    <div class="bottom-row">
      <div class="card">
        <h3><i data-lucide="lightbulb"></i> Tip Ambiental</h3>
        <p class="tip-text" id="tipText">¡Pequeñas acciones logran grandes cambios!</p>
      </div>
      <div class="card">
        <h3><i data-lucide="leaf"></i> Impacto Institucional</h3>
        <div class="stat-mini-grid" id="gCountersGrid">
          <div class="stat-mini"><span>0</span><b>Botellas</b></div>
          <div class="stat-mini"><span>0</span><b>Tapas</b></div>
        </div>
      </div>
    </div>
  </div>
</main>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.13.2/firebase-app.js";
  import { getAuth, signInAnonymously, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.13.2/firebase-auth.js";
  import { getFirestore, collection, onSnapshot } from "https://www.gstatic.com/firebasejs/10.13.2/firebase-firestore.js";

  const firebaseConfig = {
    apiKey: "AIzaSyBt1CCrUlt_wrfU574BbOzI0RfQjRHWUXE",
    authDomain: "tablero-inteligente.firebaseapp.com",
    projectId: "tablero-inteligente",
    storageBucket: "tablero-inteligente.firebasestorage.app",
    messagingSenderId: "391565457119",
    appId: "1:391565457119:web:ffd9191a85e9f3a0501b6a"
  };

  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);
  const db = getFirestore(app);

  let rawRooms = [], rawEvs = [], rawIndicators = [], rawEvents = [], rawTips = [];
  let combinedData = [], currentIndex = 0, elapsed = 0;
  let currentTipIndex = 0, tipElapsed = 0;
  const DURATION = 8000;
  const TIP_DURATION = 5000;

  function formatDriveUrl(url) {
    if (!url) return url;
    const match = url.match(/\/file\/d\/([^\/]+)\//) || url.match(/id=([^&]+)/);
    return match ? `https://lh3.googleusercontent.com/d/${match[1]}` : url;
  }

  function processData() {
    const roomPts = {}, roomCount = {}, roomPhotos = {}, roomDates = {}, counters = {};

    rawEvs.forEach(e => {
      const rid = e.roomId;
      roomPts[rid] = (roomPts[rid] || 0) + (e.puntajeObtenido || 0);
      roomCount[rid] = (roomCount[rid] || 0) + 1;
      if (e.evidenciasUrls?.length) {
        if (!roomPhotos[rid]) roomPhotos[rid] = [];
        roomPhotos[rid].push(...e.evidenciasUrls);
      }
      if (!roomDates[rid] || e.fecha > roomDates[rid]) roomDates[rid] = e.fecha;

      Object.entries(e.indicadores || {}).forEach(([k, v]) => {
        counters[k] = (counters[k] || 0) + v;
      });
    });

    combinedData = rawRooms.map(r => ({
      ...r,
      pts: roomPts[r.id] || 0,
      count: roomCount[r.id] || 0,
      photos: roomPhotos[r.id] || [],
      lastDate: roomDates[r.id] ? new Date(roomDates[r.id]).toLocaleDateString() : 'Sin datos'
    })).sort((a, b) => b.pts - a.pts);

    renderRanking();
    renderCounters(counters);
    renderEvents();
    updateCarousel();
  }

  function renderRanking() {
    const list = document.getElementById('rankingList');
    list.innerHTML = combinedData.slice(0, 15).map((r, i) => `
      <div class="ranking-item ${i === (currentIndex % combinedData.length) ? 'active' : ''}">
        <span>${i + 1}. ${r.nombre}</span>
        <span>${r.pts} pts</span>
      </div>
    `).join('');
  }

  function renderCounters(counters) {
    const grid = document.getElementById('gCountersGrid');
    const indicatorNames = rawIndicators.filter(i => i.esContador).map(i => i.nombre);

    // Incluir indicadores marcados como contadores O que contengan "Botella"/"Tapa"
    const items = Object.entries(counters).filter(([n]) => {
      const nameLower = n.toLowerCase();
      return indicatorNames.includes(n) || nameLower.includes('botella') || nameLower.includes('tapa');
    });

    grid.innerHTML = items.length ? items.map(([n, v]) => {
      const isRecycling = n.toLowerCase().includes('botella') || n.toLowerCase().includes('tapa');
      const unit = isRecycling ? ' Kg' : '';
      return `
        <div class="stat-mini"><span>${v.toLocaleString()}${unit}</span><b>${n}</b></div>
      `;
    }).join('') : '<p>Esperando datos...</p>';
  }

  function renderEvents() {
    const list = document.getElementById('eventList');
    list.innerHTML = rawEvents.length ? rawEvents.slice(0, 5).map(ev => `
      <div class="event-item">
        <b>${new Date(ev.fecha).toLocaleDateString('es-ES', {day:'numeric', month:'short'})}</b>
        <span>${ev.titulo}</span>
      </div>
    `).join('') : '<p>No hay eventos próximos.</p>';
  }

  function updateCarousel() {
    if (!combinedData.length) return;
    const cur = combinedData[currentIndex % combinedData.length];
    document.getElementById('roomName').textContent = `Evidencias de Salón: ${cur.nombre}`;
    document.getElementById('rPts').textContent = cur.pts;
    document.getElementById('rEvs').textContent = cur.count;
    document.getElementById('rDate').textContent = cur.lastDate;

    const img = document.getElementById('roomImg');
    img.src = cur.photos.length ? formatDriveUrl(cur.photos[Math.floor(Math.random() * cur.photos.length)])
                               : "https://images.unsplash.com/photo-1509062522246-3755977927d7?w=800";

    renderRanking();
  }

  function updateTip() {
    if (!rawTips.length) return;
    const tip = rawTips[currentTipIndex % rawTips.length];
    document.getElementById('tipText').textContent = tip.contenido || tip.mensaje || "¡Pequeñas acciones logran grandes cambios!";
    currentTipIndex++;
  }

  onAuthStateChanged(auth, user => {
    if (user) {
      document.getElementById('connStatus').classList.add('live');
      document.getElementById('connLabel').textContent = 'En vivo';

      onSnapshot(collection(db, 'rooms'), s => { rawRooms = s.docs.map(d => ({id:d.id, ...d.data()})); processData(); });
      onSnapshot(collection(db, 'indicators'), s => { rawIndicators = s.docs.map(d => d.data()); processData(); });
      onSnapshot(collection(db, 'evaluations'), s => { rawEvs = s.docs.map(d => d.data()); processData(); });
      onSnapshot(collection(db, 'events'), s => { rawEvents = s.docs.map(d => d.data()).filter(e => e.activa !== false).sort((a,b)=>a.fecha-b.fecha); renderEvents(); });
      onSnapshot(collection(db, 'tips'), s => {
        rawTips = s.docs.map(d => d.data()).filter(t => t.activa !== false);
        if (rawTips.length && tipElapsed === 0) updateTip();
      });
    }
  });

  signInAnonymously(auth);

  setInterval(() => {
    if (combinedData.length) {
      elapsed += 200;
      document.getElementById('timerFill').style.width = (elapsed / DURATION) * 100 + '%';
      if (elapsed >= DURATION) { elapsed = 0; currentIndex++; updateCarousel(); }
    }

    if (rawTips.length) {
      tipElapsed += 200;
      if (tipElapsed >= TIP_DURATION) {
        tipElapsed = 0;
        updateTip();
      }
    }
  }, 200);

  setInterval(() => {
    document.getElementById('clock').textContent = new Date().toLocaleTimeString('es-ES', {hour:'2-digit', minute:'2-digit'});
  }, 1000);

  lucide.createIcons();
</script>
</body>
</html>
