<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Proyecto Ecológico - Dashboard</title>

  <!-- Fuentes Google: Poppins (Titulares) e Inter (Cuerpo) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Poppins:wght@600;700&display=swap" rel="stylesheet">

  <!-- Carga de Iconos (Lucide Icons) -->
  <script src="https://unpkg.com/lucide@latest"></script>

  <style>
    /* VARIABLES DE DISEÑO ECOLÓGICO */
    :root {
      --color-primary: #2E7D32;       /* Verde Bosque */
      --color-accent: #4CAF50;        /* Verde Hoja */
      --color-surface-light: #E8F5E9; /* Verde Menta Claro */
      --color-text-main: #1B4332;     /* Verde Oscuro */
      --color-background: #FFFFFF;    /* Blanco Puro */
      --color-card-bg: #FFFFFF;
      --shadow-sm: 0 4px 12px rgba(27, 67, 50, 0.06);

      --font-heading: 'Poppins', sans-serif;
      --font-body: 'Inter', sans-serif;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: var(--font-body);
      color: var(--color-text-main);
      background-color: #F4F9F5;
      padding: 24px;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }

    /* CONTENEDOR PRINCIPAL */
    .dashboard {
      width: 100%;
      max-width: 420px;
      background-color: var(--color-background);
      border-radius: 24px;
      padding: 24px;
      box-shadow: var(--shadow-sm);
    }

    /* ENCABEZADO */
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 24px;
    }

    .header-title {
      font-family: var(--font-heading);
      color: var(--color-primary);
      font-size: 1.25rem;
    }

    .header-badge {
      background-color: var(--color-surface-light);
      color: var(--color-primary);
      padding: 6px 12px;
      border-radius: 20px;
      font-size: 0.8rem;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    /* TARJETA DE RESUMEN PRINCIPAL */
    .hero-card {
      background-color: var(--color-surface-light);
      border-radius: 16px;
      padding: 20px;
      margin-bottom: 20px;
    }

    .hero-header {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 12px;
    }

    .icon-wrapper {
      background-color: var(--color-primary);
      color: white;
      padding: 10px;
      border-radius: 12px;
      display: flex;
    }

    .hero-title {
      font-family: var(--font-heading);
      color: var(--color-primary);
      font-size: 1.1rem;
    }

    .hero-desc {
      font-size: 0.9rem;
      line-height: 1.4;
      opacity: 0.85;
      margin-bottom: 16px;
    }

    /* MÉTRICAS */
    .stats-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin-bottom: 20px;
    }

    .stat-card {
      background: var(--color-card-bg);
      padding: 12px 16px;
      border-radius: 12px;
      display: flex;
      align-items: center;
      gap: 10px;
      box-shadow: var(--shadow-sm);
    }

    .stat-card i {
      color: var(--color-accent);
    }

    .stat-val {
      font-weight: 600;
      font-size: 0.95rem;
      display: block;
    }

    .stat-label {
      font-size: 0.75rem;
      opacity: 0.7;
    }

    /* BOTONES DE ACCIÓN */
    .btn-primary {
      width: 100%;
      background-color: var(--color-primary);
      color: white;
      border: none;
      padding: 14px;
      border-radius: 12px;
      font-family: var(--font-body);
      font-weight: 600;
      font-size: 0.95rem;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      cursor: pointer;
      transition: background-color 0.2s ease;
    }

    .btn-primary:hover {
      background-color: #236327;
    }

    /* LISTA DE ACTIVIDADES */
    .section-title {
      font-family: var(--font-heading);
      font-size: 0.95rem;
      color: var(--color-primary);
      margin-bottom: 12px;
    }

    .activity-list {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .activity-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 12px;
      background-color: #F8FCF8;
      border: 1px solid var(--color-surface-light);
      border-radius: 10px;
    }

    .activity-info {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 0.85rem;
    }

    .activity-info i {
      color: var(--color-primary);
      width: 18px;
      height: 18px;
    }
  </style>
</head>
<body>

<main class="dashboard">
  <!-- Header -->
  <header class="header">
    <h1 class="header-title">Ruta Ecológica</h1>
    <div class="header-badge">
      <i data-lucide="leaf" style="width: 14px; height: 14px;"></i>
      Activo
    </div>
  </header>

  <!-- Tarjeta Principal -->
  <section class="hero-card">
    <div class="hero-header">
      <div class="icon-wrapper">
        <i data-lucide="sprout"></i>
      </div>
      <h2 class="hero-title">Impacto Ambiental</h2>
    </div>
    <p class="hero-desc">
      Monitoreo de material recolectado y puntos depositados en contenedores inteligentes.
    </p>

    <div class="stats-grid">
      <div class="stat-card">
        <i data-lucide="recycling"></i>
        <div>
          <span class="stat-val">12.5 kg</span>
          <span class="stat-label">Reciclado</span>
        </div>
      </div>
      <div class="stat-card">
        <i data-lucide="award"></i>
        <div>
          <span class="stat-val">350 Pts</span>
          <span class="stat-label">Acumulados</span>
        </div>
      </div>
    </div>

    <button class="btn-primary">
      <i data-lucide="qr-code"></i>
      Escanear Contenedor
    </button>
  </section>

  <!-- Historial de Actividad -->
  <section>
    <h3 class="section-title">Últimos Registros</h3>
    <ul class="activity-list">
      <li class="activity-item">
        <div class="activity-info">
          <i data-lucide="check-circle-2"></i>
          <span>Depósito PET (Botellas)</span>
        </div>
        <span style="font-size: 0.8rem; opacity: 0.6;">Hoy</span>
      </li>
      <li class="activity-item">
        <div class="activity-info">
          <i data-lucide="check-circle-2"></i>
          <span>Depósito de Cartón</span>
        </div>
        <span style="font-size: 0.8rem; opacity: 0.6;">Ayer</span>
      </li>
    </ul>
  </section>
</main>

<!-- Script para inicializar los iconos -->
<script>
  lucide.createIcons();
</script>
</body>
</html>
